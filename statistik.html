<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hausaufgaben-Statistik</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: eine Spalte – Kennzahlen, Tagesdiagramm, Tabelle */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#1b2a49; --muted:#5b6886; --line:#d8e0ee; --grid:#e8edf5;
  --accent:#ff7a1a; --bar:#2f80ed; --bar-hover:#1c5fbd; --blue:#2f80ed;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111a2c; --surface:#1a2640; --ink:#e8eefb; --muted:#9fb0cf; --line:#2c3b5c; --grid:#24324f;
  --accent:#ff8f3d; --bar:#6aa8ff; --bar-hover:#9cc4ff; --blue:#6aa8ff; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:18px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}
h1 span{color:var(--accent)}
h2{font-size:1.2rem}
a{color:var(--blue);text-decoration:none;font-weight:700}
.muted{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.tile small{display:block;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
.tile b{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:10px;min-width:0}
.range{display:flex;gap:6px;flex-wrap:wrap}
.range button{font:700 .9rem var(--body);padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.range button[aria-pressed="true"]{border-color:var(--bar);color:var(--ink)}
.chartbox{position:relative;overflow-x:auto;padding-top:52px}
svg{display:block;width:100%;height:auto;min-width:320px}
svg text{fill:var(--muted);font:17px var(--body)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 10px;font-size:.85rem;white-space:nowrap;transform:translate(-50%,-100%)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="./">← Alle Themen</a></nav>
  <header>
    <h1>Haus<span>aufgaben</span>-Statistik</h1>
    <p class="muted" id="status">Lade Daten …</p>
  </header>

  <div class="tiles">
    <div class="tile"><small>Heute</small><b id="tToday">–</b> <span id="tTodayPct"></span></div>
    <div class="tile"><small>Letzte 7 Tage</small><b id="tWeek">–</b> <span id="tWeekPct"></span></div>
    <div class="tile"><small>Übungstage gesamt</small><b id="tDays">–</b></div>
  </div>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h2>Aufgaben pro Tag</h2>
      <div class="range" id="range">
        <button data-days="14" aria-pressed="true">14 Tage</button>
        <button data-days="30" aria-pressed="false">30 Tage</button>
        <button data-days="90" aria-pressed="false">90 Tage</button>
      </div>
    </div>
    <div class="chartbox" id="chartbox"><div class="tip" id="tip" hidden></div></div>
    <p class="muted" style="margin:0;font-size:.9rem">Tippe auf einen Balken für die Trefferquote.</p>
  </section>

  <section class="card">
    <h2>Alle Tage</h2>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Datum</th><th>Aufgaben</th><th>Richtig</th><th>Quote</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</div>

<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const iso=d=>d.toLocaleDateString("sv-SE");
const fmtDay=s=>{const d=new Date(s+"T12:00");return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})};
const pct=(r,t)=>t?Math.round(100*r/t)+" %":"–";
let data=[], days=14;

// Beispieldaten, solange noch keine Statistik-URL eingetragen ist
function demo(){
  const out=[];for(let i=20;i>=0;i--){if(i%3===2)continue;const d=new Date();d.setDate(d.getDate()-i);
    const t=8+Math.round(Math.random()*25);out.push({date:iso(d),total:t,right:Math.round(t*(0.6+Math.random()*0.35))})}
  return out;
}

async function load(){
  const url=window.HA_CONFIG&&HA_CONFIG.statsUrl;
  if(!url){data=demo();$("status").innerHTML="<b>Beispieldaten.</b> Die Statistik ist noch nicht verbunden (statsUrl in config.js fehlt).";render();return}
  try{
    const r=await fetch(url,{cache:"no-store"});data=await r.json();
    $("status").textContent=data.length?"Stand: "+new Date().toLocaleString("de-DE",{dateStyle:"medium",timeStyle:"short"}):"Noch keine Aufgaben gelöst.";
  }catch(e){$("status").textContent="Daten konnten nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu.";data=[]}
  render();
}

function render(){
  const by=Object.fromEntries(data.map(d=>[d.date,d]));
  const today=iso(new Date());
  const t=by[today]||{total:0,right:0};
  $("tToday").textContent=t.total;$("tTodayPct").textContent=t.total?pct(t.right,t.total)+" richtig":"Aufgaben";
  let wt=0,wr=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const x=by[iso(d)];if(x){wt+=x.total;wr+=x.right}}
  $("tWeek").textContent=wt;$("tWeekPct").textContent=wt?pct(wr,wt)+" richtig":"Aufgaben";
  $("tDays").textContent=data.length;
  $("rows").innerHTML=[...data].reverse().map(d=>`<tr><td>${fmtDay(d.date)}</td><td>${d.total}</td><td>${d.right}</td><td>${pct(d.right,d.total)}</td></tr>`).join("")
    ||`<tr><td colspan="4" class="muted">Noch keine Einträge.</td></tr>`;
  chart(by);
}

function chart(by){
  const series=[];for(let i=days-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=iso(d);series.push({date:k,...(by[k]||{total:0,right:0})})}
  const W=720,H=300,L=44,R=8,T=14,B=34,pw=W-L-R,ph=H-T-B;
  const max=Math.max(5,...series.map(s=>s.total));
  const step=max<=10?2:max<=25?5:max<=60?10:20, top=Math.ceil(max/step)*step;
  const y=v=>T+ph-ph*v/top, bw=pw/series.length, barW=Math.max(3,Math.min(28,bw-4));
  let g="";
  for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const every=days<=14?1:days<=30?3:10;
  series.forEach((s,i)=>{
    const cx=L+bw*i+bw/2, h=ph*s.total/top;
    if(s.total>0){const r=Math.min(4,barW/2,h);
      g+=`<path class="bar" data-i="${i}" fill="var(--bar)" d="M${cx-barW/2},${y(0)} V${y(s.total)+r} q0,-${r} ${r},-${r} H${cx+barW/2-r} q${r},0 ${r},${r} V${y(0)} Z"/>`}
    if((series.length-1-i)%every===0){const d=new Date(s.date+"T12:00");g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${d.getDate()}.${d.getMonth()+1}.</text>`}
    g+=`<rect class="hit" data-i="${i}" x="${L+bw*i}" y="${T}" width="${bw}" height="${ph}" fill="transparent"/>`;
  });
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  const box=$("chartbox");box.querySelector("svg")?.remove();
  box.insertAdjacentHTML("beforeend",`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Aufgaben pro Tag, letzte ${days} Tage">${g}</svg>`);
  const svg=box.querySelector("svg"),tip=$("tip");
  const show=e=>{const el=e.target.closest(".hit");if(!el){tip.hidden=true;return}
    const s=series[+el.dataset.i];
    svg.querySelectorAll(".bar").forEach(b=>b.setAttribute("fill",b.dataset.i===el.dataset.i?"var(--bar-hover)":"var(--bar)"));
    tip.innerHTML=`<b>${fmtDay(s.date)}</b><br>${s.total} Aufgaben${s.total?` · ${pct(s.right,s.total)} richtig`:""}`;
    const rb=box.getBoundingClientRect(),re=el.getBoundingClientRect(),sc=re.height/ph;
    const tw=tip.offsetWidth||170,cxp=re.left-rb.left+box.scrollLeft+re.width/2;tip.hidden=false;const w2=tip.offsetWidth/2;tip.style.left=Math.max(w2+4,Math.min(box.scrollWidth-w2-4,cxp))+"px";tip.style.top=Math.max(48,re.top-rb.top+(y(s.total)-T)*sc-6)+"px";tip.hidden=false};
  svg.addEventListener("pointermove",show);svg.addEventListener("click",show);
  svg.addEventListener("pointerleave",()=>{tip.hidden=true;svg.querySelectorAll(".bar").forEach(b=>b.setAttribute("fill","var(--bar)"))});
}

$("range").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#range button").forEach(x=>x.setAttribute("aria-pressed",x===b));days=+b.dataset.days;render()};
load();
</script>
</body>
</html>
